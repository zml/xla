syntax = "proto3";

package stream_executor;

// Format of an in-memory accelerator module.
enum ModuleFormatProto {
  MODULE_FORMAT_UNSPECIFIED = 0;
  MODULE_FORMAT_CUDA_CUBIN = 1;
  MODULE_FORMAT_ROCM_HSACO = 2;
  MODULE_FORMAT_SPIRV = 3;
  MODULE_FORMAT_LEVEL_ZERO_NATIVE = 4;
}

// A target module together with the information required to load it safely.
message ModuleBinaryProto {
  ModuleFormatProto format = 1;
  bytes data = 2;

  // Empty for portable formats. Native formats use an executor-defined key
  // to reject loading on an incompatible device or driver.
  string compatibility_key = 3;
}
